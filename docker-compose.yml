services:
  postgres:
    image: postgres:16-alpine
    container_name: hotel-agency-db
    environment:
      POSTGRES_DB: hotel_agency
      POSTGRES_USER: hotel_agency
      POSTGRES_PASSWORD: hotel_agency
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel_agency"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
