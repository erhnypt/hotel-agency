spring.application.name=hotel-agency-backend
server.port=8080

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:hotel_agency}${DB_EXTRA_PARAMS:}
spring.datasource.username=${DB_USER:hotel_agency}
spring.datasource.password=${DB_PASSWORD:hotel_agency}

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# V9 was edited after it had already run in production, so its checksum no longer
# matches what's stored in flyway_schema_history. Skip validation so pending
# migrations (e.g. V10) can still apply instead of the app refusing to start.
spring.flyway.validate-on-migrate=false

app.jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-please-32-bytes-min}
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:3600000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Mail - the JavaMailSender bean is always created (Spring treats an empty spring.mail.host
# as "set"), so with SMTP_HOST unset every send attempt fails and EmailService logs it instead
# of throwing. Set SMTP_HOST/SMTP_USER/SMTP_PASS to actually deliver mail.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# JavaMail has no timeout by default, so a stuck/unreachable SMTP server would hang
# the request that triggered the email (e.g. hotel registration) indefinitely.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
