spring.application.name=hotel-agency-backend
server.port=8080

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:hotel_agency}${DB_EXTRA_PARAMS:}
spring.datasource.username=${DB_USER:hotel_agency}
spring.datasource.password=${DB_PASSWORD:hotel_agency}

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-please-32-bytes-min}
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:3600000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Mail - disabled by default; set spring.autoconfigure.exclude= (empty) and configure SMTP_* to enable
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
