spring.application.name=hotel-agency-backend
server.port=8080

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:hotel_agency}${DB_EXTRA_PARAMS:}
spring.datasource.username=${DB_USER:hotel_agency}
spring.datasource.password=${DB_PASSWORD:hotel_agency}

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# V9 was edited after it had already run in production, so its checksum no longer
# matches what's stored in flyway_schema_history. Skip validation so pending
# migrations (e.g. V10) can still apply instead of the app refusing to start.
spring.flyway.validate-on-migrate=false

app.jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-please-32-bytes-min}
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:3600000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Mail - sent via Resend's HTTP API (see EmailService), not SMTP: Render blocks
# outbound SMTP ports on every plan, so a mail server would never be reachable.
# Unset RESEND_API_KEY leaves EmailService logging sends instead of delivering them.
app.mail.resend-api-key=${RESEND_API_KEY:}
app.mail.from=${MAIL_FROM:onboarding@resend.dev}
# Extra recipient for "new hotel registration" notifications, on top of any
# AGENCY_ADMIN users. Set ADMIN_NOTIFY_EMAIL to a real inbox to actually receive them.
app.notify.admin-email=${ADMIN_NOTIFY_EMAIL:}
